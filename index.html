<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><link rel="manifest" href="./manifest.json">
<title>Controle de Estoque V5</title>
<style>
body{font-family:Arial;margin:0;background:#f3f4f6;color:#111827}header{background:#111827;color:white;padding:18px}
main{max-width:900px;margin:auto;padding:14px}.card{background:white;padding:15px;border-radius:14px;margin:12px 0;box-shadow:0 2px 8px #0001}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:white;padding:12px;border-radius:12px}.stat b{font-size:24px;display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.row>*{flex:1;min-width:140px}
input,select,button{padding:11px;border:1px solid #d1d5db;border-radius:8px;font:inherit;width:100%}button{background:#111827;color:white;font-weight:bold;border:0}
.tabs{display:flex;gap:8px;overflow:auto}.tabs button{white-space:nowrap}.active{background:#374151!important}
table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left;font-size:13px}
.ok{color:#166534}.soon{color:#92400e}.expired{color:#991b1b}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.modal>div{background:white;padding:18px;border-radius:14px;width:100%;max-width:520px}
@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}table,thead,tbody,tr,th,td{display:block}thead{display:none}tr{border:1px solid #ddd;border-radius:10px;margin:8px 0;padding:8px}td{border:0}}
</style></head><body>
<header><h1>📦 Controle de Estoque V5</h1><div>🏬 Depósito ↔ 🛒 Área de Venda ↔ 🔴 Vencidos/Perdas</div></header>
<main>
<div class="grid"><div class="stat"><b id="dep">0</b>un. depósito</div><div class="stat"><b id="sale">0</b>un. venda</div><div class="stat"><b id="soon">0</b>próx. vencimento</div><div class="stat"><b id="loss">0</b>un. perdas</div></div>
<section class="card"><div class="tabs"><button id="bdep" class="active" onclick="view='dep';render()">🏬 Depósito</button><button id="bsale" onclick="view='sale';render()">🛒 Venda</button><button id="bloss" onclick="view='loss';render()">🔴 Perdas</button><button id="ball" onclick="view='all';render()">📋 Todos</button></div></section>
<section class="card"><h2>➕ Cadastrar produto/lote</h2>
<div class="row"><select id="cat" onchange="features()"><option value="">Categoria</option><option>Bebidas</option><option>Alimentos</option><option>Limpeza</option><option>Higiene</option><option>Outros</option></select><input id="prod" placeholder="Produto"><input id="brand" placeholder="Marca"><input id="vol" placeholder="Volume"></div>
<div class="row"><select id="feat"><option>Selecione</option></select><input id="ean" placeholder="Código de barras"><select id="ptype"><option value="unidade">Unidade</option><option value="fardo">Fardo</option><option value="caixa">Caixa</option></select><input id="packs" type="number" min="0" placeholder="Fardos/caixas"></div>
<div class="row"><input id="perpack" type="number" min="1" placeholder="Unidades por fardo/caixa"><input id="loose" type="number" min="0" placeholder="Unidades avulsas"><input id="date" type="date"><input id="lot" placeholder="Lote"></div>
<div class="row"><select id="loc"><option value="dep">Depósito</option><option value="sale">Área de Venda</option></select><select id="mode"><option value="exact">Quantidade exata</option><option value="approx">Quantidade aproximada</option></select><input id="alert" type="number" min="0" value="7" placeholder="Aviso antes (dias)"></div>
<button onclick="add()">Adicionar</button></section>
<section class="card"><h2>🔎 Controle</h2><div class="row"><input id="search" oninput="render()" placeholder="Pesquisar produto, marca, código ou lote"><select id="filter" onchange="render()"><option value="all">Todas</option><option value="ok">Data boa</option><option value="soon">Próximo vencimento</option><option value="expired">Vencido</option></select></div>
<div style="overflow:auto"><table><thead><tr><th>Produto</th><th>Local</th><th>Quantidade</th><th>Validade</th><th>Ação</th></tr></thead><tbody id="list"></tbody></table></div></section>
<section class="card"><h2>🔄 Histórico</h2><div style="overflow:auto"><table><thead><tr><th>Data</th><th>Produto</th><th>Movimento</th><th>Qtd.</th></tr></thead><tbody id="history"></tbody></table></div></section>
<section class="card"><button onclick="backup()">💾 Baixar backup</button></section>
</main>
<div id="modal" class="modal"><div><h2>🔄 Movimentar</h2><p id="title"></p><select id="to"><option value="sale">🛒 Área de Venda</option><option value="dep">🏬 Depósito</option><option value="loss">🔴 Vencidos/Perdas</option></select><div class="row"><input id="mp" type="number" min="0" placeholder="Fardos/caixas"><input id="ml" type="number" min="0" placeholder="Unidades"></div><p id="avail"></p><button onclick="move()">Confirmar</button><button onclick="closeM()" style="margin-top:8px;background:#6b7280">Cancelar</button></div></div>
<script>
const K='estoque_v5',H='estoque_v5_h';let items=JSON.parse(localStorage.getItem(K)||'[]'),hist=JSON.parse(localStorage.getItem(H)||'[]'),view='dep',mid=null,$=id=>document.getElementById(id);
const opts={Bebidas:['Normal','Zero','Com gás','Sem gás','Outro'],Alimentos:['Normal','Integral','Diet','Zero açúcar','Outro'],Limpeza:['Concentrado','Pronto para uso','Outro'],Higiene:['Normal','Infantil','Outro'],Outros:['Normal','Outro']};
function features(){$('feat').innerHTML=(opts[$('cat').value]||['Normal','Outro']).map(x=>'<option>'+x+'</option>').join('')}
function total(x){return x.pt==='unidade'?x.l:x.P*x.u+x.l} function label(x){return x.pt==='unidade'?x.l+' un.':x.P+' '+x.pt+'(s) × '+x.u+' = '+total(x)+' un.'}
function st(x){let d=Math.ceil((new Date(x.date+'T00:00:00')-new Date(new Date().toDateString()))/86400000);return d<0?['expired','Vencido']:d<=x.alert?['soon',d?'Vence em '+d+'d':'Vence hoje']:['ok','Data boa']}
function save(){localStorage.setItem(K,JSON.stringify(items));localStorage.setItem(H,JSON.stringify(hist))}
function add(){let c=$('cat').value,p=$('prod').value.trim(),b=$('brand').value.trim(),v=$('vol').value.trim(),d=$('date').value;if(!c||!p||!b||!v||!d)return alert('Preencha os campos principais.');let pt=$('ptype').value,P=+$('packs').value||0,u=+$('perpack').value||1,l=+$('loose').value||0;if(pt==='unidade'){l=P;P=0;u=1}items.push({id:Date.now(),c,p,b,v,f:$('feat').value,ean:$('ean').value.trim(),pt,P,u,l,date:d,lot:$('lot').value.trim(),loc:$('loc').value,mode:$('mode').value,alert:+$('alert').value||7});save();render();alert('Produto cadastrado.')}
function openM(id){mid=id;let x=items.find(i=>i.id===id);$('title').textContent=x.p+' — '+x.b+' — '+x.v+' — '+x.f+' — '+new Date(x.date+'T00:00:00').toLocaleDateString('pt-BR');$('to').value=x.loc==='dep'?'sale':'dep';$('avail').textContent='Disponível: '+label(x);$('mp').value='';$('ml').value='';$('modal').classList.add('open')}
function closeM(){$('modal').classList.remove('open');mid=null}
function move(){let x=items.find(i=>i.id===mid),to=$('to').value,P=+$('mp').value||0,L=+$('ml').value||0;if(!x||to===x.loc)return;if(x.pt==='unidade'){L+=P;P=0}if(P>x.P||L>x.l)return alert('Quantidade maior que a disponível.');let from=x.loc;x.P-=P;x.l-=L;if(to==='loss')items.push({...x,id:Date.now(),loc:'loss',P,l:L,lossDate:new Date().toISOString().slice(0,10),source:from});else{let t=items.find(y=>y.loc===to&&y.p===x.p&&y.b===x.b&&y.v===x.v&&y.f===x.f&&y.date===x.date&&y.lot===x.lot&&y.pt===x.pt&&y.u===x.u&&y.ean===x.ean);if(t){t.P+=P;t.l+=L}else items.push({...x,id:Date.now(),loc:to,P,l:L})}if(total(x)===0)items=items.filter(i=>i.id!==x.id);hist.unshift({d:new Date().toLocaleString('pt-BR'),p:x.p+' '+x.b+' '+x.v,from,to,q:P*x.u+L});save();closeM();render()}
function render(){['bdep','bsale','bloss','ball'].forEach(x=>$(x).classList.remove('active'));$(view==='dep'?'bdep':view==='sale'?'bsale':view==='loss'?'bloss':'ball').classList.add('active');let q=$('search').value.toLowerCase(),f=$('filter').value,a=items.filter(x=>{let l=view==='all'||view==='dep'&&x.loc==='dep'||view==='sale'&&x.loc==='sale'||view==='loss'&&x.loc==='loss';return l&&(x.p+' '+x.b+' '+x.v+' '+x.f+' '+x.ean+' '+x.lot).toLowerCase().includes(q)&&(view==='loss'||f==='all'||st(x)[0]===f)});$('dep').textContent=items.filter(x=>x.loc==='dep').reduce((s,x)=>s+total(x),0);$('sale').textContent=items.filter(x=>x.loc==='sale').reduce((s,x)=>s+total(x),0);$('soon').textContent=items.filter(x=>x.loc!=='loss'&&st(x)[0]==='soon').reduce((s,x)=>s+total(x),0);$('loss').textContent=items.filter(x=>x.loc==='loss').reduce((s,x)=>s+total(x),0);$('list').innerHTML=a.map(x=>{let s=st(x);return '<tr><td><b>'+x.p+'</b><br>'+x.b+' • '+x.v+' • '+x.f+'<br><small>'+(x.ean||'Sem código')+' • '+(x.lot||'Sem lote')+'</small></td><td>'+(x.loc==='dep'?'🏬 Depósito':x.loc==='sale'?'🛒 Área de Venda':'🔴 Perda')+'</td><td>'+label(x)+'</td><td>'+new Date(x.date+'T00:00:00').toLocaleDateString('pt-BR')+'<br><span class="'+s[0]+'">'+s[1]+'</span></td><td>'+(x.loc==='loss'?'': '<button onclick="openM('+x.id+')">↔ Movimentar</button>')+'</td></tr>'}).join('')||'<tr><td colspan="5">Nenhum item.</td></tr>';$('history').innerHTML=hist.map(h=>'<tr><td>'+h.d+'</td><td>'+h.p+'</td><td>'+h.from+' → '+h.to+'</td><td>'+h.q+' un.</td></tr>').join('')}
function backup(){let a=document.createElement('a'),b=new Blob([JSON.stringify({items,hist},null,2)],{type:'application/json'});a.href=URL.createObjectURL(b);a.download='backup-estoque-v4.json';a.click()}
render();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
let dp=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;let b=document.createElement('button');b.textContent='📱 Instalar Controle de Estoque';b.style.cssText='position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:9999;padding:14px 18px;border:0;border-radius:12px;background:#111827;color:white;font-weight:bold';b.onclick=async()=>{dp.prompt();await dp.userChoice;dp=null;b.remove()};document.body.appendChild(b)});
</script></body></html>
